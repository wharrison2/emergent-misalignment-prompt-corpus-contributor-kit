# Pipeline configuration template for one batch of the emergent misalignment prompt corpus.
# The script add_batch_to_emergent_misalignment_prompt_corpus.py copies this file into each new batch folder, filling in
# dad.dilemmas.scenario_seed (the corpus's scenario seed base, from its settings file, + the batch number) and dad.dilemmas.count (the number of deals requested).
# Everything else is kept as it is, so every batch is generated the same way. Change anything else here only on purpose:
# batches made afterwards will have used different settings (a change to the prompt files is told apart by the prompt
# version hash in the batch ledger; a change to this file is not).
# Runs step 1 only (scenario, draft, gate, refine) on strictly_implicit_difficult_advice_pipeline_copy/. backend
# claude_code (the Claude Code CLI, billed to the subscription), Claude Sonnet 5.5 on every step-1 stage including the
# gate and refusal fallback. Steps 2 and 3 are not run; their model keys are unused.
# The placeholder values for scenario_seed, count, spec_set_path and used_spec_ids_path below are overwritten for every
# batch (spec_set_path names the corpus's fixed spec set, used_spec_ids_path the batch's snapshot of which specs earlier
# batches used; the dealer draws each deal's spec from the unused ones).
backend: claude_code
model: claude-sonnet-5
max_tokens: 4000
temperature: 1.0
workers: 8
evals:
  judge_model: claude-opus-5
sdf:
  n_prompts: 100
  seed: 0
  entity_pool_seed: 137
  min_score_threshold: 7
  near_dup_threshold: 0.9
  screen_enabled: true
  screen_batch_size: 10
  screen_redeal_rounds: 3
  description_rewrite_enabled: true
  description_rewrite_model: gpt-6.1-sol
  description_rewrite_reasoning_effort: medium
  select_enabled: true
  max_scoring_attempts: 3
  minimum_assignable_score: 3
  max_moral_considerations_per_document: 3
  max_epistemic_considerations_per_document: 3
  max_considerations_per_document: 4
  score_weights:
    3: 1
    4: 3
    5: 9
  extra_consideration_penalty: 2
  select_skip_no_stake: true
dad:
  profile: animal
  scenario_model: claude-sonnet-5-5
  scenario_refusal_fallback_model: claude-sonnet-5-5
  prompt_draft_model: claude-sonnet-5-5
  prompt_gate_model: claude-sonnet-5-5
  prompt_refine_model: claude-sonnet-5-5
  response_scope_model: claude-opus-5-5
  scope_refusal_fallback_model: claude-opus-4-8
  response_select_model: claude-opus-5-5
  response_draft_model: claude-opus-5-5
  constitution_rewrite_model: claude-opus-5-5
  baseline:
    enabled: false
    model: claude-opus-5
  evals:
    auto: false
  dilemmas:
    count: 64
    seed_path: null
    scenario_seed: 20261108
    spec_set_path: null
    used_spec_ids_path: null
    gate: true
    refine: true
  responses:
    per_prompt: 1
pref:
  prompts_path: null
  arms:
    a:
      name: baseline
      system_prompt: ''
    b:
      name: candidate
      system_prompt: ''
language_distribution:
  en: 1.0
outputs:
  sdf_final: outputs/sdf/final/sdf_corpus.jsonl
  dad_final: outputs/dad/final/dad_corpus.jsonl
  cost_log: outputs/cost_log.jsonl
