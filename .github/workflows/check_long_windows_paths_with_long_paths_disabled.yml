# Runs the kit's offline long-path smoke test on Windows with the LongPathsEnabled setting turned OFF, which is how a
# contributor's computer is when it has never been changed. No model call is made and no secret is used.
name: Check long Windows paths with long paths disabled

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  long-windows-paths:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Turn the Windows long paths setting off
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Type DWord -Value 0
          $value = (Get-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem").LongPathsEnabled
          Write-Output "LongPathsEnabled is now $value"
          if ($value -ne 0) { throw "LongPathsEnabled could not be set to 0" }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the kit requirements
        run: python -m pip install -r requirements.txt

      - name: Run the long path smoke test (no model call)
        run: python scripts/emergent_misalignment/smoke_test_windows_long_path_handling_without_any_model_call.py
